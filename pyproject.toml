[project]
name			= "call-me-maybe"
version 		= "0.1.0"
description 	= "42 Call Me Maybe, LLM under Constrained Decoding"
readme 			= "README.md"
requires-python	= ">=3.13"
dependencies	= [
    "flake8>=7.3.0",
    "flake8-docstrings>=1.7.0",
    "llm-sdk",
    "mypy>=2.1.0",
    "pydantic>=2.13.4",
    "pydocstyle>=6.3.0",
    "regex>=2026.5.9",
]

[[project.authors]]
name	= "Teddy Andrianina"
email	= "trakotoz@student.42antananarivo.mg"

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[[tool.mypy.overrides]]
module = ["regex"]
ignore_missing_imports = true
